<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahana Trackers | Portal</title>
<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleSignIn()"
onerror="handleGsiLoadError()"></script>
<style>
:root {
--bg-color: #00332e;
--panel-color: rgba(255, 255, 255, 0.08);
--border-color: rgba(255, 255, 255, 0.15);
--accent-color: #00796b;
--text-main: #ffffff;
--text-dim: #b2dfdb;
}
* { box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
body {
background: var(--bg-color);
background-image: linear-gradient(180deg, #00332e 0%, #001a1a 100%);
color: var(--text-main);
margin: 0;
min-height: 100vh;
display: flex;
flex-direction: column;
}
header {
background: rgba(0, 0, 0, 0.3);
backdrop-filter: blur(20px);
border-bottom: 1px solid var(--border-color);
padding: 12px 20px;
display: flex;
align-items: center;
justify-content: space-between;
position: sticky;
top: 0;
z-index: 1000;
flex-wrap: wrap;
gap: 10px;
}
.header-left { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
.logo-group { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 5px 10px;
border-radius: 8px; cursor: pointer; transition: 0.2s ease; }
.logo-group:hover { background: rgba(255,255,255,0.12); }
.logo-group img { height: 28px; width: auto; }
.site-title { font-weight: 500; font-size: 1rem; letter-spacing: 0.5px; border-left: 1px solid var(--border-color);
padding-left: 15px; }
.header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.user-meta { font-size: 0.8rem; color: var(--text-dim); }
.btn {
background: var(--panel-color);
border: 1px solid var(--border-color);
color: white;
padding: 8px 16px;
border-radius: 6px;
cursor: pointer;
font-size: 0.8rem;
transition: all 0.2s ease;
white-space: nowrap;
}
.btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }

/* ===== HEADER ICON BUTTONS ===== */
.icon-action {
background: var(--panel-color);
border: 1px solid var(--border-color);
color: var(--text-main);
width: 36px; height: 36px; padding: 0;
border-radius: 8px;
display: flex; align-items: center; justify-content: center;
cursor: pointer; transition: all 0.2s ease;
position: relative;
}
.icon-action:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }
.icon-action svg {
width: 18px; height: 18px;
stroke: currentColor; fill: none;
stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.notif-dot {
position: absolute; top: -3px; right: -3px;
min-width: 16px; height: 16px; padding: 0 4px;
background: #ff5252; color: #fff;
border-radius: 8px; font-size: 0.65rem; font-weight: 700;
display: flex; align-items: center; justify-content: center;
}

.btn-primary { background: var(--accent-color); border: none; font-weight: 600; }
.btn-primary:hover { background: #00897b; }
.btn-small { padding: 6px 12px; font-size: 0.75rem; }
.icon-btn { padding: 6px 12px; font-size: 0.9rem; line-height: 1; font-weight: 700; }
.icon-tick { color: #69f0ae; border-color: #69f0ae; }
.icon-tick:hover { background: rgba(105,240,174,0.15); }
.icon-cross { color: #ff8a80; border-color: #ff8a80; }
.icon-cross:hover { background: rgba(255,138,128,0.15); }
.main-content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
.glass-panel {
background: var(--panel-color);
backdrop-filter: blur(30px);
border: 1px solid var(--border-color);
border-radius: 16px;
padding: 30px;
width: 100%;
max-width: 420px;
box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}
.wide-panel { max-width: 900px; }
.entry-panel { max-width: 1200px; }
.hidden { display: none !important; }
h2 { font-weight: 400; margin-top: 0; margin-bottom: 20px; letter-spacing: -0.5px; font-size: 1.3rem; }
label { display: block; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px;
margin-bottom: 6px; }
input, select, textarea {
width: 100%; padding: 12px; margin-bottom: 20px;
background: rgba(0,0,0,0.2); border: 1px solid var(--border-color);
border-radius: 6px; color: white; font-size: 1rem;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent-color); outline: none; background: rgba(0,0,0,0.4); }
select { cursor: pointer; }
.dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
.dashboard-item {
background: rgba(255,255,255,0.03); padding: 30px 20px; border-radius: 12px;
text-align: center; border: 1px solid var(--border-color);
cursor: pointer; transition: 0.2s ease;
}
.dashboard-item:hover { background: rgba(255,255,255,0.08); transform: translateY(-3px); border-color: var(--accent-color); }
.dashboard-item strong { display: block; font-size: 1.1rem; font-weight: 500; }
.dashboard-item small { color: var(--text-dim); font-size: 0.75rem; }
.entry-layout { display: grid; grid-template-columns: 180px 1fr; gap: 30px; }
.task-sidebar { display: flex; flex-direction: column; gap: 8px; border-right: 1px solid var(--border-color); padding-right: 18px; }
.task-sidebar-item {
cursor: pointer; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem;
background: rgba(255,255,255,0.03); border: 1px solid var(--border-color);
transition: 0.15s ease;
}
.task-sidebar-item:hover { background: rgba(255,255,255,0.08); }
.task-sidebar-item.active { background: var(--accent-color); border-color: var(--accent-color); font-weight: 600; }

/* ===== PHASE SYSTEM (Level 0 only) ===== */
.phase-bar {
display: flex; flex-wrap: wrap; gap: 8px;
margin-bottom: 25px; padding-bottom: 20px;
border-bottom: 1px solid var(--border-color);
}
.phase-btn {
background: rgba(255,255,255,0.03); border: 1px solid var(--border-color);
color: var(--text-dim); padding: 8px 14px; border-radius: 20px;
cursor: pointer; font-size: 0.8rem; transition: 0.15s ease; white-space: nowrap;
}
.phase-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-main); }
.phase-btn.active { background: var(--accent-color); border-color: var(--accent-color);
color: #fff; font-weight: 600; }
.empty-tile {
border: 1px dashed var(--border-color); border-radius: 12px;
padding: 60px 20px; text-align: center;
color: var(--text-dim); font-size: 0.9rem;
}
.sidebar-empty { color: var(--text-dim); font-size: 0.8rem; padding: 10px 2px; }

/* ===== MESSAGE TEMPLATES ===== */
.template-editor-row {
background: rgba(255,255,255,0.03); border: 1px solid var(--border-color);
border-radius: 10px; padding: 16px; margin-bottom: 16px;
}
.template-editor-row label { margin-bottom: 8px; }
.template-editor-row textarea {
margin-bottom: 0; min-height: 80px; font-size: 0.9rem; resize: vertical;
font-family: inherit; line-height: 1.5;
}
.template-empty-note { color: var(--text-dim); font-size: 0.85rem; font-style: italic; }
#template-tile { margin-bottom: 24px; }
#template-tile .copyable-text { white-space: pre-wrap; word-break: normal; }

.data-section { margin-top: 40px; }
.data-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
.data-table th { text-align: left; padding: 12px; border-bottom: 2px solid var(--border-color); color: var(--text-dim);
font-size: 0.75rem; text-transform: uppercase; }
.data-table td { padding: 14px 12px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
.data-table input { margin: 0; padding: 6px 8px; width: 90px; font-size: 0.8rem; }
.copyable-tile {
background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 8px;
padding: 15px; margin-bottom: 20px; position: relative;
}
.copyable-text { word-break: break-all; font-size: 0.9rem; color: var(--text-dim); margin-bottom: 10px;
padding-right: 70px; }
.copy-btn { padding: 6px 12px; font-size: 0.75rem; position: absolute; top: 10px; right: 10px; }
.radio-group { display: flex; gap: 20px; margin-bottom: 20px; }
.radio-group label { display: flex; align-items: center; gap: 8px; margin-bottom: 0; cursor: pointer; }
.radio-group input[type="radio"] { width: auto; margin: 0; }
.time-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
gap: 15px; margin-bottom: 20px; }
.time-inputs input, .time-inputs select { margin-bottom: 0; }

@media (max-width: 700px) {
.entry-layout { grid-template-columns: 1fr; }
.task-sidebar { flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--border-color);
padding-right: 0; padding-bottom: 16px; }
}
@media (max-width: 600px) {
header { padding: 10px 15px; }
.site-title { display: none; }
.dashboard-grid { grid-template-columns: 1fr; }
.glass-panel { padding: 20px; }
.data-table { font-size: 0.8rem; }
.data-table td { padding: 8px; }
.data-table input { width: 70px; padding: 4px; }
.empty-tile { padding: 40px 15px; }
}

a.dashboard-item, a.task-sidebar-item {
  text-decoration: none;
  color: inherit;
  display: block;
}
</style>
</head>

async function apiCall(action, payload = {}) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, idToken, ...payload })
  });
  return res.json();
}

function initGoogleSignIn() {
  if (typeof google === 'undefined') {
    handleGsiLoadError();
    return;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(
    document.getElementById('g_id_signin'),
    { theme: 'filled_black', size: 'large', width: 260 }
  );
  if (idToken) {
    completeLogin();
  } else {
    google.accounts.id.prompt();
  }
}

function handleGsiLoadError() {
  document.getElementById('login-status').innerText =
    "Could not load Google Sign-In. Make sure this page is served over https:// and that you have an internet connection.";
}

function handleCredentialResponse(response) {
  idToken = response.credential;
  localStorage.setItem('mahana_idToken', idToken);
  completeLogin();
}

async function completeLogin() {
  const statusEl = document.getElementById('login-status');
  statusEl.innerText = "Verifying...";
  try {
    const result = await apiCall('whoami');
    if (!result.ok) {
      statusEl.innerText = result.error || "Authorization Failed";
      idToken = null;
      localStorage.removeItem('mahana_idToken');
      google.accounts.id.prompt();
      return;
    }
    user = { name: result.name, email: result.email, level: result.level };
    statusEl.innerText = "";
    document.getElementById('scr-login').classList.add('hidden');
    document.getElementById('btn-logout').classList.remove('hidden');
    document.getElementById('btn-notifications').classList.remove('hidden');
    document.getElementById('active-user-display').classList.remove('hidden');
    document.getElementById('active-user-display').innerText = user.name;

    loadTemplates();

    window.addEventListener('hashchange', route);

    if (window.location.hash && window.location.hash !== '#') {
      route();
    } else {
      redirectToDefault();
    }
  } catch (e) {
    statusEl.innerText = "Could not reach the server. Please try again.";
    idToken = null;
    localStorage.removeItem('mahana_idToken');
  }
}

function doLogout() {
  window.removeEventListener('hashchange', route);
  idToken = null;
  localStorage.removeItem('mahana_idToken');
  user = null;
  profile = null;
  currentTask = null;
  currentPhase = null;
  templates = {};
  templatesLoaded = false;
  google.accounts.id.disableAutoSelect();
  history.replaceState(null, '', window.location.pathname);
  location.reload();
}

/* =========================
   DATE / TIME FORMATTING
   ========================= */

// "2026-08-29" -> "29 Aug 26"
// Split as text rather than using new Date(), because new Date("2026-08-29")
// is parsed as UTC midnight and can shift back a day in local time.
function formatDateDMY(iso) {
  if (!iso) return "";
  const p = String(iso).split('-');
  if (p.length !== 3) return iso;
  const months = ["Jan","Feb","Mar","Apr","May","Jun",
                  "Jul","Aug","Sep","Oct","Nov","Dec"];
  return parseInt(p[2], 10) + " " + (months[parseInt(p[1], 10) - 1] || p[1]) + " " + p[0].slice(2);
}

async function loadTemplates() {
  try {
    const result = await apiCall('templateList');
    if (result.ok) {
      templates = result.templates || {};
      templatesLoaded = true;
      // If a template task is already open, refresh its tile.
      if (currentTask && TEMPLATE_TASKS.includes(currentTask)) renderTemplateTile();
      if (currentTask === "Message Templates") renderTemplateEditor();
    }
  } catch (e) {
    // Non-fatal: tiles show a fallback note instead.
  }
}

function renderTemplateTile() {
  const tile = document.getElementById('template-tile');
  const textEl = document.getElementById('template-tile-text');
  const copyBtn = document.getElementById('template-copy-btn');

  if (!currentTask || !TEMPLATE_TASKS.includes(currentTask)) {
    tile.classList.add('hidden');
    return;
  }

  tile.classList.remove('hidden');
  const text = String(templates[currentTask] || "").trim();

  if (!text) {
    textEl.innerText = templatesLoaded
      ? "No message set yet."
      : "Loading message...";
    textEl.classList.add('template-empty-note');
    copyBtn.style.display = 'none';
  } else {
    textEl.innerText = text;
    textEl.classList.remove('template-empty-note');
    copyBtn.style.display = 'block';
  }
}

function renderTemplateEditor() {
  const list = document.getElementById('template-editor-list');
  list.innerHTML = "";
  TEMPLATE_TASKS.forEach((task, i) => {
    const val = String(templates[task] || "");
    const div = document.createElement('div');
    div.className = 'template-editor-row';
    const lbl = document.createElement('label');
    lbl.innerText = task;
    const ta = document.createElement('textarea');
    ta.id = 'tpl-' + i;
    ta.setAttribute('data-task', task);
    ta.value = val;
    ta.placeholder = 'Message staff will copy for this task';
    div.appendChild(lbl);
    div.appendChild(ta);
    list.appendChild(div);
  });
  document.getElementById('template-save-status').innerText = "";
}

async function saveTemplates() {
  const status = document.getElementById('template-save-status');
  const btn = document.getElementById('btn-save-templates');
  const payload = {};
  document.querySelectorAll('#template-editor-list textarea').forEach(ta => {
    payload[ta.getAttribute('data-task')] = ta.value.trim();
  });

  btn.disabled = true;
  status.innerText = "Saving...";
  try {
    const result = await apiCall('templateSave', { templates: payload });
    if (!result.ok) {
      status.innerText = result.error || "Could not save";
      btn.disabled = false;
      return;
    }
    templates = payload;
    templatesLoaded = true;
    status.innerText = "Saved.";
  } catch (e) {
    status.innerText = "Network error";
  }
  btn.disabled = false;
}

/* =========================
   PHASE HELPERS
   ========================= */

function getPhaseForTask(taskName) {
  for (const phase in PHASES) {
    if (PHASES[phase].includes(taskName)) return phase;
  }
  return "Other";
}

// True when a Level 0 user is standing in their OWN workspace.
// That workspace becomes a full map of every task in the system.
function isAdminPanel() {
  return !!(user && user.level === 0 && profile && profile.name === user.name);
}

// Every task in the system, in phase order, deduped.
function allTaskNames() {
  const out = [];
  Object.keys(PHASES).forEach(p => {
    PHASES[p].forEach(t => {
      if (TASK_CONFIG[t] && out.indexOf(t) === -1) out.push(t);
    });
  });
  // Safety net: anything in TASK_CONFIG not yet placed in PHASES.
  Object.keys(TASK_CONFIG).forEach(t => {
    if (out.indexOf(t) === -1) out.push(t);
  });
  return out;
}

function staffTaskList() {
  if (isAdminPanel()) return allTaskNames();
  return (profile && profile.tasks) ? profile.tasks.filter(Boolean) : [];
}

function tasksInPhase(phase) {
  if (!phase) return [];
  const all = staffTaskList();
  if (phase === "Other") return all.filter(t => getPhaseForTask(t) === "Other");
  return all.filter(t => (PHASES[phase] || []).includes(t));
}

function phasesForStaff() {
  const all = staffTaskList();
  const present = Object.keys(PHASES).filter(p => all.some(t => PHASES[p].includes(t)));
  if (all.some(t => getPhaseForTask(t) === "Other")) present.push("Other");
  return present;
}

function setPhase(phase) {
  currentPhase = phase;
  // Switching phase while a task is open clears the task and returns to the empty tile.
  if (currentTask && !tasksInPhase(phase).includes(currentTask)) {
    currentTask = null;
    window.location.hash = '#/staff/' + encodeURIComponent(profile.name);
    return;
  }
  renderEntryScreen();
}

function renderPhaseBar() {
  const bar = document.getElementById('phase-bar');
  if (!user || user.level !== 0) {
    bar.classList.add('hidden');
    bar.innerHTML = "";
    return;
  }
  bar.classList.remove('hidden');
  const present = phasesForStaff();
  if (present.length === 0) {
    bar.innerHTML = `<span class="sidebar-empty">No phases available for this workspace.</span>`;
    return;
  }
  bar.innerHTML = present.map(p =>
    `<button class="phase-btn${p === currentPhase ? ' active' : ''}" ` +
    `onclick="setPhase('${p.replace(/'/g, "\\'")}')">${p}</button>`
  ).join('');
}

/* =========================
   ROUTING
   ========================= */

function route() {
  if (!user) return;
  const raw = window.location.hash.replace(/^#\/?/, '');
  const segments = raw.split('/').filter(Boolean).map(decodeURIComponent);

  if (segments[0] === 'select') {
    if (user.level === 0 || user.level === 1) {
      renderSelectionScreen();
    } else {
      redirectToDefault();
    }
  } else if (segments[0] === 'staff' && segments[1]) {
    const staffName = segments[1];
    if (!STAFF[staffName] || !canAccessStaffFrontend(staffName)) {
      redirectToDefault();
      return;
    }
    profile = { name: staffName, ...STAFF[staffName] };

    if (segments[2] && staffTaskList().includes(segments[2])) {
      currentTask = segments[2];
      // Deep link straight to a task: light up the phase that task belongs to.
      if (user.level === 0) currentPhase = getPhaseForTask(currentTask);
      renderEntryScreen();
    } else {
      currentTask = null;
      if (user.level === 0) {
        renderEntryScreen();
      } else {
        renderProfileScreen();
      }
    }
  } else {
    redirectToDefault();
  }
}

async function loadTemp() {
  const config = TASK_CONFIG[currentTask];
  const isTempOrPerm = config.tempOrPerm === "TEMP OR PERMANENT";

  // Don't load temp entries for PERMANENT-only tasks
  if (!isTempOrPerm) return;

  const body = document.getElementById('data-body');
  body.innerHTML = `<tr><td colspan="6" style="color:var(--text-dim)">Loading...</td></tr>`;
  try {
    const result = await apiCall('tempList', { targetStaffName: profile.name, taskName: currentTask });
    if (!result.ok) {
      body.innerHTML = `<tr><td colspan="6">${result.error || 'Could not load entries'}</td></tr>`;
      return;
    }
    tempEntries = result.items || [];
    renderTable();
  } catch (e) {
    body.innerHTML = `<tr><td colspan="6">Network error</td></tr>`;
  }
}

function filterTable() {
  const q = document.getElementById('search-temp').value.trim().toLowerCase();
  if (!q) { renderTable(); return; }
  const filtered = tempEntries.filter(item =>
    String(item.comment || "").toLowerCase().includes(q) ||
    String(item.staffName || "").toLowerCase().includes(q) ||
    String(item.refNo || "").toLowerCase().includes(q) ||
    String(item.caseNo || "").toLowerCase().includes(q)
  );
  renderTable(filtered);
}

function renderTable(list) {
  const items = list || tempEntries;
  const body = document.getElementById('data-body');
  body.innerHTML = "";
  if (items.length === 0) {
    body.innerHTML = `<tr><td colspan="6" style="color:var(--text-dim)">No matching entries</td></tr>`;
    return;
  }
  items.forEach(item => {
    body.insertAdjacentHTML('beforeend', `<tr>
      <td>${item.staffName}</td>
      <td style="color:var(--text-dim); font-size:0.85rem;">${item.createdAt || ''}</td>
      <td>${item.comment || ''}</td>
      <td><input type="text" class="row-ref" data-id="${item.tempId}" value="${item.refNo || ''}" style="margin:0; padding:6px 8px; width:90px; font-size:0.8rem;"></td>
      <td><input type="text" class="row-case" data-id="${item.tempId}" value="${item.caseNo || ''}" style="margin:0; padding:6px 8px; width:90px; font-size:0.8rem;"></td>
      <td style="text-align:right; white-space:nowrap;">
        <button class="btn icon-btn icon-tick" onclick="finalizeEntryWithInputs('${item.tempId}')" title="Finalize">&#10003;</button>
        <button class="btn icon-btn icon-cross" onclick="removeEntry('${item.tempId}')" title="Delete">&#10005;</button>
      </td>
    </tr>`);
  });
}

function addLocalTempEntry(entry) {
  tempEntries.unshift(entry);
  renderTable();
}

function removeLocalTempEntry(tempId) {
  tempEntries = tempEntries.filter(item => String(item.tempId) !== String(tempId));
  renderTable();
}

async function saveData(type) {
  if (type === 'Temp') {
    const comment = document.getElementById('field-comment').value.trim();
    const ref = document.getElementById('field-ref').value.trim();
    const cas = document.getElementById('field-case').value.trim();

    if (!comment) return alert("Comment required for Temp Save");

    try {
      const result = await apiCall('tempAdd', {
        targetStaffName: profile.name,
        taskName: currentTask,
        comment, refNo: ref, caseNo: cas
      });
      if (!result.ok) return alert(result.error || "Could not save entry");

      addLocalTempEntry({
        tempId: result.tempId,
        staffName: profile.name,
        taskName: currentTask,
        comment, refNo: ref, caseNo: cas,
        createdAt: result.createdAt || "Just now",
        createdBy: result.createdBy || user.name
      });

      document.getElementById('field-ref').value = "";
      document.getElementById('field-case').value = "";
      document.getElementById('field-comment').value = "";
    } catch (e) {
      alert("Network error while saving.");
    }
  } else {
    const ref = document.getElementById('field-ref').value.trim();
    const cas = document.getElementById('field-case').value.trim();
    const comment = document.getElementById('field-comment').value.trim();

    if (!ref && !cas) return alert("Reference No OR Case No required for Final Save");

    try {
      const result = await apiCall('finalAdd', {
        targetStaffName: profile.name,
        taskName: currentTask,
        comment, refNo: ref, caseNo: cas
      });
      if (!result.ok) return alert(result.error || "Could not save entry");
      alert("Confirmed. Data pushed to central records.");
      document.getElementById('field-ref').value = "";
      document.getElementById('field-case').value = "";
      document.getElementById('field-comment').value = "";
    } catch (e) {
      alert("Network error while saving.");
    }
  }
}

async function saveRiderScheduling(type) {

  const cas = document.getElementById('field-case-rider').value.trim();
  const comment = document.getElementById('field-comment-rider').value.trim();

  const min = document.getElementById('field-min-rider').value;
  const ampm = document.getElementById('field-ampm-rider').value;
  const remarks = document.getElementById('field-remarks-rider').value.trim();

  if (type === 'Temp') {
    if (!comment) return alert("Comment required for Temp Save");
    try {
      const result = await apiCall('tempAdd', {
        targetStaffName: profile.name,
        taskName: currentTask,
        comment, refNo: ref, caseNo: cas,
        scheduledDate: formatDateDMY(date),
        scheduledTime: (hour && min && ampm) ? `${hour}:${min} ${ampm}` : "",
        remarks: remarks
      });
      if (!result.ok) return alert(result.error);

      addLocalTempEntry({
        tempId: result.tempId,
        staffName: profile.name,
        taskName: currentTask,
        comment, refNo: ref, caseNo: cas,
        remarks: remarks,
        createdAt: result.createdAt || "Just now",
        createdBy: result.createdBy || user.name
      });

      clearRiderForm();
    } catch (e) {
      alert("Network error");
    }
  } else {
    if (!ref && !cas) return alert("Reference No OR Case No required");
    if (!date) return alert("Date required");
    if (!hour || !min || !ampm) return alert("Time required");

    // Build the date from parts so it is compared in local time, not UTC.
    const dp = date.split('-');
    const selectedDate = new Date(+dp[0], +dp[1] - 1, +dp[2]);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    if (selectedDate < today) return alert("Date cannot be in the past");

    try {
      const result = await apiCall('finalAdd', {
        targetStaffName: profile.name,
        taskName: currentTask,
        comment, refNo: ref, caseNo: cas,
        scheduledDate: formatDateDMY(date),
        scheduledTime: `${hour}:${min} ${ampm}`,
        remarks: remarks
      });
      if (!result.ok) return alert(result.error);
      alert("Rider scheduling saved!");
      clearRiderForm();
    } catch (e) {
      alert("Network error");
    }
  }
}

function clearRiderForm() {
  document.getElementById('field-ref-rider').value = "";
  document.getElementById('field-case-rider').value = "";
  document.getElementById('field-comment-rider').value = "";
  document.getElementById('field-date-rider').value = "";
  document.getElementById('field-hour-rider').value = "";
  document.getElementById('field-min-rider').value = "";

}

async function finalizeEntryWithInputs(tempId) {
  const refInput = document.querySelector(`.row-ref[data-id="${tempId}"]`);
  const caseInput = document.querySelector(`.row-case[data-id="${tempId}"]`);
  const refNo = refInput ? refInput.value.trim() : "";
  const caseNo = caseInput ? caseInput.value.trim() : "";

  if (!refNo && !caseNo) {
    alert("Fill in Reference No OR Case No before finalizing.");
    return;
  }

  if (!confirm("Push this entry to Final records?")) return;

  try {
    const result = await apiCall('tempFinalize', { tempId, refNo, caseNo });
    if (!result.ok) return alert(result.error || "Could not finalize");
    removeLocalTempEntry(tempId);
  } catch (e) {
    alert("Network error");
  }
}

async function removeEntry(tempId) {
  if (!confirm("Permanently delete this entry?")) return;
  try {
    const result = await apiCall('tempDelete', { tempId });
    if (!result.ok) return alert(result.error || "Could not delete");
    removeLocalTempEntry(tempId);
  } catch (e) {
    alert("Network error");
  }
}

function copyToClipboard(elementId) {
  const text = document.getElementById(elementId).innerText;
  navigator.clipboard.writeText(text).then(() => {
    alert('Copied to clipboard!');
  }).catch(() => {
    alert('Failed to copy');
  });
}

/* =========================
   ENTER KEY SHORTCUTS
   Comment  -> Temp Save (only where a Temp Save button is visible)
   Ref/Case -> Final Save
   Row inputs in the temp table -> finalize that row
   ========================= */
const FORM_ACTIONS = {
  'form-default':          { save: saveData,            tempBtn: 'btn-temp-save-default' },
  'form-rider-scheduling': { save: saveRiderScheduling, tempBtn: 'btn-temp-save-rider' },
  'form-visit-rating':     { save: saveVisitRating,     tempBtn: null },
  'form-approval':         { save: saveApproval,        tempBtn: 'btn-temp-save-approval' },
  'form-copyable-tile':    { save: saveCopyableTile,    tempBtn: 'btn-temp-save-tile' }
};

function handleEnterKey(e) {
  if (e.key !== 'Enter') return;
  const el = e.target;
  if (!el || el.tagName !== 'INPUT') return;

  // Rows inside the Recent Temporary Entries table.
  if (el.classList.contains('row-ref') || el.classList.contains('row-case')) {
    e.preventDefault();
    finalizeEntryWithInputs(el.getAttribute('data-id'));
    return;
  }

  const formDiv = el.closest('[id^="form-"]');
  if (!formDiv) return;
  const cfg = FORM_ACTIONS[formDiv.id];
  if (!cfg) return;

  const id = el.id || "";

  if (id.indexOf('field-comment') === 0) {
    e.preventDefault();
    // Only fire if this task actually offers a Temp Save.
    const btn = cfg.tempBtn ? document.getElementById(cfg.tempBtn) : null;
    if (btn && btn.style.display !== 'none') cfg.save('Temp');
    return;
  }

  if (id.indexOf('field-ref') === 0 || id.indexOf('field-case') === 0) {
    e.preventDefault();
    cfg.save('Final');
  }
}

document.addEventListener('keydown', handleEnterKey);

function hideAll() {
  document.querySelectorAll('.glass-panel').forEach(p => p.classList.add('hidden'));
}
