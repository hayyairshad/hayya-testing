<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahana Trackers | Portal</title>
    <script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleSignIn()" onerror="handleGsiLoadError()"></script>
    <style>
        :root {
            --bg-color: #00332e;
            --panel-color: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.15);
            --accent-color: #00796b;
            --text-main: #ffffff;
            --text-dim: #b2dfdb;
        }

        * { box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }

        body {
            background: var(--bg-color);
            background-image: linear-gradient(180deg, #00332e 0%, #001a1a 100%);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-left { display: flex; align-items: center; gap: 20px; }
        .logo-group { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.05); padding: 5px 12px; border-radius: 8px; }
        .logo-group img { height: 32px; width: auto; }
        .site-title { font-weight: 500; font-size: 1.1rem; letter-spacing: 0.5px; border-left: 1px solid var(--border-color); padding-left: 20px; }

        .header-right { display: flex; align-items: center; gap: 20px; }
        .user-meta { font-size: 0.85rem; color: var(--text-dim); }

        .btn {
            background: var(--panel-color);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }
        .btn-primary { background: var(--accent-color); border: none; font-weight: 600; }
        .btn-primary:hover { background: #00897b; }

        .icon-btn { padding: 6px 16px; font-size: 1rem; line-height: 1; font-weight: 700; }
        .icon-tick { color: #69f0ae; border-color: #69f0ae; }
        .icon-tick:hover { background: rgba(105,240,174,0.15); }
        .icon-cross { color: #ff8a80; border-color: #ff8a80; }
        .icon-cross:hover { background: rgba(255,138,128,0.15); }

        .main-content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .glass-panel {
            background: var(--panel-color);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .wide-panel { max-width: 900px; }
        .entry-panel { max-width: 1000px; }
        .hidden { display: none !important; }

        h2 { font-weight: 400; margin-top: 0; margin-bottom: 25px; letter-spacing: -0.5px; }
        label { display: block; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }

        input {
            width: 100%; padding: 12px; margin-bottom: 20px;
            background: rgba(0,0,0,0.2); border: 1px solid var(--border-color);
            border-radius: 6px; color: white; font-size: 1rem;
        }
        input:focus { border-color: var(--accent-color); outline: none; background: rgba(0,0,0,0.4); }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .dashboard-item {
            background: rgba(255,255,255,0.03); padding: 30px 20px; border-radius: 12px;
            text-align: center; border: 1px solid var(--border-color);
            cursor: pointer; transition: 0.2s ease;
        }
        .dashboard-item:hover { background: rgba(255,255,255,0.08); transform: translateY(-3px); border-color: var(--accent-color); }
        .dashboard-item strong { display: block; font-size: 1.1rem; font-weight: 500; }
        .dashboard-item small { color: var(--text-dim); font-size: 0.75rem; }

        /* ENTRY LAYOUT: left task sidebar + right form */
        .entry-layout { display: grid; grid-template-columns: 180px 1fr; gap: 30px; }
        .task-sidebar { display: flex; flex-direction: column; gap: 8px; border-right: 1px solid var(--border-color); padding-right: 18px; }
        .task-sidebar-item {
            cursor: pointer; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem;
            background: rgba(255,255,255,0.03); border: 1px solid var(--border-color);
            transition: 0.15s ease;
        }
        .task-sidebar-item:hover { background: rgba(255,255,255,0.08); }
        .task-sidebar-item.active { background: var(--accent-color); border-color: var(--accent-color); font-weight: 600; }

        .data-section { margin-top: 40px; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .data-table th { text-align: left; padding: 12px; border-bottom: 2px solid var(--border-color); color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; }
        .data-table td { padding: 14px 12px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }

        @media (max-width: 700px) {
            .entry-layout { grid-template-columns: 1fr; }
            .task-sidebar { flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--border-color); padding-right: 0; padding-bottom: 16px; }
        }

        @media (max-width: 600px) {
            header { padding: 10px 20px; }
            .site-title { display: none; }
            .dashboard-grid { grid-template-columns: 1fr; }
            .glass-panel { padding: 25px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="logo-group">
                <img src="mahana-logo.png" alt="Mahana">
                <img src="friends-logo.png" alt="Friends">
            </div>
            <span class="site-title">Mahana Trackers</span>
        </div>
        <div class="header-right">
            <button id="nav-back" class="btn hidden" onclick="navigateBack()">Back</button>
            <span id="active-user-display" class="user-meta hidden"></span>
            <button id="btn-logout" class="btn hidden" onclick="doLogout()">Sign Out</button>
        </div>
    </header>

    <div class="main-content">
        <!-- 1. LOGIN -->
        <div id="scr-login" class="glass-panel">
            <h2>Sign In</h2>
            <p style="color:var(--text-dim); font-size:0.85rem; margin-top:-15px; margin-bottom:25px;">
                Sign in with your authorized Google account.
            </p>
            <div id="g_id_signin" style="display:flex; justify-content:center;"></div>
            <div id="login-status" style="text-align:center; color:var(--text-dim); font-size:0.8rem; margin-top:16px;"></div>
        </div>

        <!-- 2. STAFF SELECT -->
        <div id="scr-select" class="glass-panel wide-panel hidden">
            <h2>Workspace Management</h2>
            <div id="staff-grid" class="dashboard-grid"></div>
        </div>

        <!-- 3. TASK SELECT -->
        <div id="scr-tasks" class="glass-panel wide-panel hidden">
            <h2 id="workspace-label">Workspace</h2>
            <div id="task-grid" class="dashboard-grid"></div>
        </div>

        <!-- 4. DATA ENTRY -->
        <div id="scr-entry" class="glass-panel entry-panel hidden">
            <div class="entry-layout">
                <div id="task-sidebar" class="task-sidebar"></div>

                <div>
                    <h2 id="bold-task-header" style="font-weight: 600;"></h2>

                    <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:20px;">
                        <div>
                            <label>Reference Number</label>
                            <input type="number" id="field-ref" inputmode="numeric">
                        </div>
                        <div>
                            <label>Case Number</label>
                            <input type="number" id="field-case" inputmode="numeric">
                        </div>
                        <div>
                            <label>Comment</label>
                            <input type="text" id="field-comment">
                        </div>
                    </div>

                    <div style="display:flex; align-items:center; gap:12px; margin-top:10px;">
                        <button class="btn btn-primary" id="btn-temp-save" onclick="saveData('Temp')">Temp Save</button>
                        <button class="btn" id="btn-final-save" onclick="saveData('Final')">Final Save</button>
                    </div>

                    <div class="data-section">
                        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
                            <label style="margin-bottom:0;">Recent Temporary Entries</label>
                            <div style="display:flex; gap:8px; align-items:center;">
                                <div style="position:relative;">
                                    <span style="position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-dim); font-size:0.8rem;">&#128269;</span>
                                    <input type="text" id="search-temp" placeholder="Search entries" oninput="filterTable()"
                                        style="margin:0; padding:8px 12px 8px 30px; width:180px; font-size:0.8rem;">
                                </div>
                                <button class="btn" style="padding:4px 10px; font-size:0.7rem;" onclick="loadTemp()">Refresh</button>
                            </div>
                        </div>
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Staff Member</th>
                                    <th>Timestamp</th>
                                    <th>Comment</th>
                                    <th style="text-align:right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="data-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ====== BACKEND CONFIG ======
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxn-JCO5-neqyNDZgj-jFeTQFDSd2JdD_ls-qoqrIcP4Ni0_t-B02inJTEtoTndGjUCEA/exec";
        const GOOGLE_CLIENT_ID = "766825494798-2vq54u2u9kmfegir98uig2ubr9gr6hj4.apps.googleusercontent.com";

        // Frontend-only role/task config, keyed by StaffName (must match the "StaffName"
        // column in the Users sheet exactly). Permission level itself comes from the backend.
        const STAFF = {
            "Jawad":   { role: "Director",         tasks: ["Cross Checking", "Entries"] },
            "Uzair":   { role: "Manager HP",        tasks: ["Presentation"] },
            "Ahmed":   { role: "Head of Recovery",  tasks: ["Reporting"] },
            "Waqas":   { role: "Rider",             tasks: ["Visit"] },
            "Junaid":  { role: "Clerk",             tasks: ["Delivery Linkage"] },
            "Zuni":    { role: "Manager Recovery",  tasks: ["Entries"] },
            "Sumaira": { role: "Call Center",       tasks: ["Follow-up"] }
        };

        let idToken = null;
        let user = null;        // { name, email, level } - from backend whoami
        let profile = null;     // { name, role, tasks } - whose workspace is open
        let currentTask = null;
        let tempEntries = [];

        // ---- Generic backend call ----
        async function apiCall(action, payload = {}) {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action, idToken, ...payload })
            });
            return res.json();
        }

        // ---- Google Sign-In ----
        function initGoogleSignIn() {
            if (typeof google === 'undefined') {
                handleGsiLoadError();
                return;
            }
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.getElementById('g_id_signin'),
                { theme: 'filled_black', size: 'large', width: 260 }
            );
            google.accounts.id.prompt();
        }

        function handleGsiLoadError() {
            document.getElementById('login-status').innerText =
                "Could not load Google Sign-In. Make sure this page is served over http(s):// " +
                "(not opened as a local file:// path) and that you have an internet connection.";
        }

        function handleCredentialResponse(response) {
            idToken = response.credential;
            completeLogin();
        }

        async function completeLogin() {
            const statusEl = document.getElementById('login-status');
            statusEl.innerText = "Verifying...";
            try {
                const result = await apiCall('whoami');
                if (!result.ok) {
                    statusEl.innerText = result.error || "Authorization Failed — this Google account is not on the allowlist.";
                    idToken = null;
                    return;
                }
                user = { name: result.name, email: result.email, level: result.level };
                statusEl.innerText = "";

                document.getElementById('scr-login').classList.add('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                document.getElementById('active-user-display').classList.remove('hidden');
                document.getElementById('active-user-display').innerText = user.name;

                if (user.level < 2) showSelection();
                else openProfile(user.name);
            } catch (e) {
                statusEl.innerText = "Could not reach the server. Please try again.";
            }
        }

        function doLogout() {
            idToken = null;
            user = null;
            profile = null;
            google.accounts.id.disableAutoSelect();
            location.reload();
        }

        // ---- Navigation screens ----
        function showSelection() {
            hideAll();
            document.getElementById('scr-select').classList.remove('hidden');
            document.getElementById('nav-back').classList.add('hidden');
            const grid = document.getElementById('staff-grid');
            grid.innerHTML = "";
            Object.entries(STAFF).forEach(([name, s]) => {
                if (user.level === 0 || name !== "Jawad") {
                    grid.insertAdjacentHTML('beforeend', `
                        <div class="dashboard-item" onclick="openProfile('${name}')">
                            <strong>${name}</strong>
                            <small>${s.role}</small>
                        </div>
                    `);
                }
            });
        }

        function openProfile(name) {
            hideAll();
            profile = { name, ...STAFF[name] };
            document.getElementById('scr-tasks').classList.remove('hidden');
            document.getElementById('workspace-label').innerText = name + "'s Workspace";
            if (user.level < 2) document.getElementById('nav-back').classList.remove('hidden');
            const grid = document.getElementById('task-grid');
            grid.innerHTML = "";
            profile.tasks.forEach(t => {
                grid.insertAdjacentHTML('beforeend', `<div class="dashboard-item" onclick="openForm('${t}')"><strong>${t}</strong></div>`);
            });
        }

        async function openForm(task) {
            hideAll();
            document.getElementById('scr-entry').classList.remove('hidden');
            document.getElementById('bold-task-header').innerText = task;
            document.getElementById('nav-back').classList.remove('hidden');
            currentTask = task;
            renderTaskSidebar();
            await loadTemp();
        }

        function renderTaskSidebar() {
            const sb = document.getElementById('task-sidebar');
            sb.innerHTML = "";
            profile.tasks.forEach(t => {
                const active = t === currentTask;
                sb.insertAdjacentHTML('beforeend', `
                    <div class="task-sidebar-item${active ? ' active' : ''}" onclick="openForm('${t}')">${t}</div>
                `);
            });
        }

        // ---- Temp / Final data ----
        async function loadTemp() {
            const body = document.getElementById('data-body');
            body.innerHTML = `<tr><td colspan="4" style="color:var(--text-dim)">Loading...</td></tr>`;
            try {
                const result = await apiCall('tempList', { targetStaffName: profile.name, taskName: currentTask });
                if (!result.ok) {
                    body.innerHTML = `<tr><td colspan="4">${result.error || 'Could not load entries'}</td></tr>`;
                    return;
                }
                tempEntries = result.items || [];
                renderTable();
            } catch (e) {
                body.innerHTML = `<tr><td colspan="4">Network error</td></tr>`;
            }
        }

        function filterTable() {
            const q = document.getElementById('search-temp').value.trim().toLowerCase();
            if (!q) { renderTable(); return; }
            const filtered = tempEntries.filter(item =>
                String(item.comment || "").toLowerCase().includes(q) ||
                String(item.staffName || "").toLowerCase().includes(q) ||
                String(item.refNo || "").toLowerCase().includes(q) ||
                String(item.caseNo || "").toLowerCase().includes(q)
            );
            renderTable(filtered);
        }

        function renderTable(list) {
            const items = list || tempEntries;
            const body = document.getElementById('data-body');
            body.innerHTML = "";
            if (items.length === 0) {
                body.innerHTML = `<tr><td colspan="4" style="color:var(--text-dim)">No matching entries</td></tr>`;
                return;
            }
            items.forEach(item => {
                body.insertAdjacentHTML('beforeend', `<tr>
                    <td>${item.staffName}</td>
                    <td style="color:var(--text-dim)">${item.createdAt || ''}</td>
                    <td>${item.comment || ''}</td>
                    <td style="text-align:right">
                        <button class="btn icon-btn icon-tick" onclick="finalizeEntry('${item.tempId}')" title="Finalize">&#10003;</button>
                        <button class="btn icon-btn icon-cross" onclick="removeEntry('${item.tempId}')" title="Delete">&#10005;</button>
                    </td>
                </tr>`);
            });
        }

        async function saveData(type) {
            const ref = document.getElementById('field-ref').value;
            const cas = document.getElementById('field-case').value;
            const comment = document.getElementById('field-comment').value;

            try {
                if (type === 'Temp') {
                    if (!comment) return alert("Comment required");
                    const result = await apiCall('tempAdd', {
                        targetStaffName: profile.name,
                        taskName: currentTask,
                        comment, refNo: ref, caseNo: cas
                    });
                    if (!result.ok) return alert(result.error || "Could not save entry");
                } else {
                    if (!ref && !cas) return alert("Reference or Case Required");
                    const result = await apiCall('finalAdd', {
                        targetStaffName: profile.name,
                        taskName: currentTask,
                        comment, refNo: ref, caseNo: cas
                    });
                    if (!result.ok) return alert(result.error || "Could not save entry");
                    alert("Confirmed. Data pushed to central records.");
                }

                document.getElementById('field-ref').value = "";
                document.getElementById('field-case').value = "";
                document.getElementById('field-comment').value = "";
                await loadTemp();
            } catch (e) {
                alert("Network error while saving.");
            }
        }

        async function finalizeEntry(tempId) {
            const entry = tempEntries.find(e => String(e.tempId) === String(tempId));
            let refNo = entry ? String(entry.refNo || "") : "";
            let caseNo = entry ? String(entry.caseNo || "") : "";

            if (!refNo && !caseNo) {
                refNo = window.prompt("Reference Number (leave blank to use Case Number instead):", "") || "";
                if (!refNo) {
                    caseNo = window.prompt("Case Number:", "") || "";
                }
                if (!refNo && !caseNo) {
                    alert("Reference or Case Number is required to finalize.");
                    return;
                }
            }

            if (!confirm("Push this entry to Final records?")) return;
            const result = await apiCall('tempFinalize', { tempId, refNo, caseNo });
            if (!result.ok) return alert(result.error || "Could not finalize");
            await loadTemp();
        }

        async function removeEntry(tempId) {
            if (!confirm("Permanently delete this entry?")) return;
            const result = await apiCall('tempDelete', { tempId });
            if (!result.ok) return alert(result.error || "Could not delete");
            await loadTemp();
        }

        function hideAll() {
            document.querySelectorAll('.glass-panel').forEach(p => p.classList.add('hidden'));
        }

        function navigateBack() {
            if (!document.getElementById('scr-entry').classList.contains('hidden')) openProfile(profile.name);
            else if (!document.getElementById('scr-tasks').classList.contains('hidden')) showSelection();
        }
    </script>
</body>
</html>
