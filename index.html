<style>
:root {
--bg-color: #00332e;
--panel-color: rgba(255, 255, 255, 0.08);
--border-color: rgba(255, 255, 255, 0.15);
--accent-color: #00796b;
--text-main: #ffffff;
--text-dim: #b2dfdb;
}
* { box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
body {
background: var(--bg-color);
background-image: linear-gradient(180deg, #00332e 0%, #001a1a 100%);
color: var(--text-main);
margin: 0;
min-height: 100vh;
display: flex;
flex-direction: column;
}
header {
background: rgba(0, 0, 0, 0.3);
backdrop-filter: blur(20px);
border-bottom: 1px solid var(--border-color);
padding: 12px 40px;
display: flex;
align-items: center;
justify-content: space-between;
position: sticky;
top: 0;
z-index: 1000;
}
.header-left { display: flex; align-items: center; gap: 20px; }
.logo-group { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.05); padding: 5px 12px;
border-radius: 8px; }
.logo-group img { height: 32px; width: auto; }
.site-title { font-weight: 500; font-size: 1.1rem; letter-spacing: 0.5px; border-left: 1px solid var(--border-color);
padding-left: 20px; }
.header-right { display: flex; align-items: center; gap: 20px; }
.user-meta { font-size: 0.85rem; color: var(--text-dim); }
.btn {
background: var(--panel-color);
border: 1px solid var(--border-color);
color: white;
padding: 10px 24px;
border-radius: 6px;
cursor: pointer;
font-size: 0.85rem;
transition: all 0.2s ease;
}
.btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }
.btn-primary { background: var(--accent-color); border: none; font-weight: 600; }
.btn-primary:hover { background: #00897b; }
.btn-small { padding: 6px 12px; font-size: 0.75rem; }
.icon-btn { padding: 6px 16px; font-size: 1rem; line-height: 1; font-weight: 700; }
.icon-tick { color: #69f0ae; border-color: #69f0ae; }
.icon-tick:hover { background: rgba(105,240,174,0.15); }
.icon-cross { color: #ff8a80; border-color: #ff8a80; }
.icon-cross:hover { background: rgba(255,138,128,0.15); }
.main-content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.glass-panel {
background: var(--panel-color);
backdrop-filter: blur(30px);
border: 1px solid var(--border-color);
border-radius: 16px;
padding: 40px;
width: 100%;
max-width: 420px;
box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}
.wide-panel { max-width: 900px; }
.entry-panel { max-width: 1150px; }
.hidden { display: none !important; }
h2 { font-weight: 400; margin-top: 0; margin-bottom: 25px; letter-spacing: -0.5px; }
label { display: block; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px;
margin-bottom: 6px; }
input, select, textarea {
width: 100%; padding: 12px; margin-bottom: 20px;
background: rgba(0,0,0,0.2); border: 1px solid var(--border-color);
border-radius: 6px; color: white; font-size: 1rem;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent-color); outline: none; background: rgba(0,0,0,0.4); }
select { cursor: pointer; }
.dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
.dashboard-item {
background: rgba(255,255,255,0.03); padding: 30px 20px; border-radius: 12px;
text-align: center; border: 1px solid var(--border-color);
cursor: pointer; transition: 0.2s ease;
}
.dashboard-item:hover { background: rgba(255,255,255,0.08); transform: translateY(-3px); border-color: var(--accent-color); }
.dashboard-item strong { display: block; font-size: 1.1rem; font-weight: 500; }
.dashboard-item small { color: var(--text-dim); font-size: 0.75rem; }
.entry-layout { display: grid; grid-template-columns: 180px 1fr; gap: 30px; }
.task-sidebar { display: flex; flex-direction: column; gap: 8px; border-right: 1px solid var(--border-color); padding-right: 18px; }
.task-sidebar-item {
cursor: pointer; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem;
background: rgba(255,255,255,0.03); border: 1px solid var(--border-color);
transition: 0.15s ease;
}
.task-sidebar-item:hover { background: rgba(255,255,255,0.08); }
.task-sidebar-item.active { background: var(--accent-color); border-color: var(--accent-color); font-weight: 600; }
.data-section { margin-top: 40px; }
.data-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
.data-table th { text-align: left; padding: 12px; border-bottom: 2px solid var(--border-color); color: var(--text-dim);
font-size: 0.75rem; text-transform: uppercase; }
.data-table td { padding: 14px 12px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
.copyable-tile {
background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 8px;
padding: 15px; margin-bottom: 20px; position: relative;
}
.copyable-text { word-break: break-all; font-size: 0.9rem; color: var(--text-dim); margin-bottom: 10px; }
.copy-btn { padding: 6px 12px; font-size: 0.75rem; position: absolute; top: 10px; right: 10px; }
.radio-group { display: flex; gap: 20px; margin-bottom: 20px; }
.radio-group label { display: flex; align-items: center; gap: 8px; margin-bottom: 0; cursor: pointer; }
.radio-group input[type="radio"] { width: auto; margin: 0; }
.time-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
.time-inputs input { margin-bottom: 0; }
.rating-select { max-width: 200px; }

@media (max-width: 700px) {
.entry-layout { grid-template-columns: 1fr; }
.task-sidebar { flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--border-color);
padding-right: 0; padding-bottom: 16px; }
}
@media (max-width: 600px) {
header { padding: 10px 20px; }
.site-title { display: none; }
.dashboard-grid { grid-template-columns: 1fr; }
.glass-panel { padding: 25px; }
}
</style>

<script>
// ====== BACKEND CONFIG ======
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxn-JCO5-neqyNDZgj-jFeTQFDSd2JdD_ls-qoqrIcP4Ni0_t-B02inJTEtoTndGjUCEA/exec";

// Updated STAFF config with ALL 29 tasks

  },
  "Ahmed": {

  },
  "Junaid": { 
    role: "Clerk", 
    tasks: ["Rider Call & Visit Scheduling", "Visit Rating & Feedback", "Physical Document Archive", "Sale Processing", "Voucher Processing", "Delivery Linkage", "Mahana Temporary Verification"] 
  },
  "Zuni": { 
  role: "Manager Recovery", 
  tasks: ["Entries", "Digital Document Archive", "Installment Voucher", "Installment Slip Received"] 
},
  "Samiya": { 
    role: "Call Center", 
    tasks: ["WhatsApp Contact Save", "Customer Thank You Confirmation", "Initial Documents Collection", "Installment Slip Received"] 
  },
  "Nabiha": { 
    role: "Operations", 
    tasks: ["Cheque Management", "Installment Plan Sent", "6-Month Report Submission", "Branch & Salesman Report", "Cheque Exemption & Red Cases", "Case Completion Thank You", "Updated Installment Plan Sent", "Delivery Linkage"] 
  },
  "Sumaira": { 
    role: "Recovery Officer", 
    tasks: ["Recovery Follow-up"] 
  }
};

// Task configuration (temp/permanent, copyable text, etc.)
const TASK_CONFIG = {
    "Entries": { tempOrPerm: "TEMP OR PERMANENT", interface: "default" },
  "WhatsApp Contact Save": { tempOrPerm: "TEMP OR PERMANENT", interface: "default" },
  "Customer Thank You Confirmation": { tempOrPerm: "PERMANENT", interface: "default" },
  "Initial Documents Collection": { tempOrPerm: "TEMP OR PERMANENT", interface: "default" },
  "Rider Call & Visit Scheduling": { tempOrPerm: "PERMANENT", interface: "rider-scheduling" },
  "Visit Rating & Feedback": { tempOrPerm: "PERMANENT", interface: "visit-rating" },
  "Approval Request Sent": { tempOrPerm: "PERMANENT", interface: "approval" },
  "Advance/Cheque Arrangement": { tempOrPerm: "PERMANENT", interface: "copyable-tile", copyableText: "Message customer about advance/cheque arrangement" },
  "Advance Confirmation": { tempOrPerm: "PERMANENT", interface: "copyable-tile", copyableText: "Advance confirmation message" },

  "Installment Plan Sent": { tempOrPerm: "PERMANENT", interface: "default" },
  "Tele File Documentation": { tempOrPerm: "PERMANENT", interface: "default" },
  "Recovery Follow-up": { tempOrPerm: "PERMANENT", interface: "default" },
  "Recovery Presentation": { tempOrPerm: "PERMANENT", interface: "default" },
  "6-Month Report Submission": { tempOrPerm: "PERMANENT", interface: "default" },
  "Branch & Salesman Report": { tempOrPerm: "PERMANENT", interface: "default" },
  "Cheque Exemption & Red Cases": { tempOrPerm: "PERMANENT", interface: "default" },
  "Case Completion Thank You": { tempOrPerm: "PERMANENT", interface: "default" },
  "Installment Slip Received": { tempOrPerm: "PERMANENT", interface: "default" },
  "Installment Voucher": { tempOrPerm: "PERMANENT", interface: "default" },
  "Installment File Update": { tempOrPerm: "PERMANENT", interface: "default" },
  "Updated Installment Plan Sent": { tempOrPerm: "PERMANENT", interface: "default" },
  "Delivery Linkage": { tempOrPerm: "PERMANENT", interface: "default" },
  "Mahana Temporary Verification": { tempOrPerm: "PERMANENT", interface: "default" },
  "Gift Issued for Early Payment": { tempOrPerm: "PERMANENT", interface: "default" }
};

let idToken = null;
let user = null;
let profile = null;
let currentTask = null;
let tempEntries = [];

// ---- Generic backend call ----
async function apiCall(action, payload = {}) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, idToken, ...payload })
  });
  return res.json();
}

// ---- Google Sign-In ----
function initGoogleSignIn() {
  if (typeof google === 'undefined') {
    handleGsiLoadError();
    return;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(
    document.getElementById('g_id_signin'),
    { theme: 'filled_black', size: 'large', width: 260 }
  );
  google.accounts.id.prompt();
}

function handleGsiLoadError() {
  document.getElementById('login-status').innerText =
    "Could not load Google Sign-In. Make sure this page is served over http(s):// and that you have an internet connection.";
}

function handleCredentialResponse(response) {
  idToken = response.credential;
  completeLogin();
}

async function completeLogin() {
  const statusEl = document.getElementById('login-status');
  statusEl.innerText = "Verifying...";
  try {
    const result = await apiCall('whoami');
    if (!result.ok) {
      statusEl.innerText = result.error || "Authorization Failed";
      idToken = null;
      return;
    }
    user = { name: result.name, email: result.email, level: result.level };
    statusEl.innerText = "";
    document.getElementById('scr-login').classList.add('hidden');
    document.getElementById('btn-logout').classList.remove('hidden');
    document.getElementById('active-user-display').classList.remove('hidden');
    document.getElementById('active-user-display').innerText = user.name;
    if (user.level < 2) showSelection();
    else openProfile(user.name);
  } catch (e) {
    statusEl.innerText = "Could not reach the server. Please try again.";
  }
}

function doLogout() {
  idToken = null;
  user = null;
  profile = null;
  google.accounts.id.disableAutoSelect();
  location.reload();
}

// ---- Navigation screens ----
function showSelection() {
  hideAll();
  document.getElementById('scr-select').classList.remove('hidden');
  document.getElementById('nav-back').classList.add('hidden');
  
  const grid = document.getElementById('staff-grid');
  grid.innerHTML = "";
  
  Object.entries(STAFF).forEach(([name, s]) => {
    let shouldShow = false;
    
    if (user.level === 0) {
      // Director sees everyone
      shouldShow = true;
    } else if (user.level === 1) {
      // Managers see everyone EXCEPT Jawad
      shouldShow = (name !== "Jawad");
    } else {
      // Staff see only themselves
      shouldShow = (user.staffName === name);
    }
    
    if (shouldShow) {
      grid.insertAdjacentHTML('beforeend', `
        <div class="dashboard-item" onclick="openProfile('${name}')">
          <strong>${name}</strong>
          <small>${s.role}</small>
        </div>
      `);
    }
  });
}

function openProfile(name) {
  hideAll();
  profile = { name, ...STAFF[name] };
  document.getElementById('scr-tasks').classList.remove('hidden');
  document.getElementById('workspace-label').innerText = name + "'s Workspace";
  if (user.level < 2) document.getElementById('nav-back').classList.remove('hidden');
  
  const grid = document.getElementById('task-grid');
  grid.innerHTML = "";
  
  // If Jawad (Level 0), show ALL tasks from that person
  // Otherwise show only their assigned tasks
  let tasksToShow = profile.tasks;
  if (user.level === 0) {
    tasksToShow = profile.tasks; // Jawad sees all their tasks
  }
  
  tasksToShow.forEach(t => {
    grid.insertAdjacentHTML('beforeend', `<div class="dashboard-item" onclick="openForm('${t}')"><strong>${t}</strong></div>`);
  });
}

async function openForm(task) {
  hideAll();
  document.getElementById('scr-entry').classList.remove('hidden');
  document.getElementById('bold-task-header').innerText = task;
  document.getElementById('nav-back').classList.remove('hidden');
  currentTask = task;
  renderTaskSidebar();
  renderFormInterface();
  await loadTemp();
}

function renderTaskSidebar() {
  const sb = document.getElementById('task-sidebar');
  sb.innerHTML = "";
  profile.tasks.forEach(t => {
    const active = t === currentTask;
    sb.insertAdjacentHTML('beforeend', `
      <div class="task-sidebar-item${active ? ' active' : ''}" onclick="openForm('${t}')">${t}</div>
    `);
  });
}

function renderFormInterface() {
  // Hide all forms first
  document.getElementById('form-default').classList.add('hidden');
  document.getElementById('form-rider-scheduling').classList.add('hidden');
  document.getElementById('form-visit-rating').classList.add('hidden');
  document.getElementById('form-approval').classList.add('hidden');
  document.getElementById('form-copyable-tile').classList.add('hidden');
  
  const config = TASK_CONFIG[currentTask];
  const isTempOrPerm = config.tempOrPerm === "TEMP OR PERMANENT";
  
  // Show appropriate form
  if (config.interface === "rider-scheduling") {
    document.getElementById('form-rider-scheduling').classList.remove('hidden');
  } else if (config.interface === "visit-rating") {
    document.getElementById('form-visit-rating').classList.remove('hidden');
  } else if (config.interface === "approval") {
    document.getElementById('form-approval').classList.remove('hidden');
  } else if (config.interface === "copyable-tile") {
    document.getElementById('form-copyable-tile').classList.remove('hidden');
    document.getElementById('copyable-text-tile').innerText = config.copyableText;
    const tempBtn = document.getElementById('btn-temp-save-tile');
    const finalBtn = document.getElementById('btn-final-save-tile');
    if (isTempOrPerm) tempBtn.style.display = 'block';
    else tempBtn.style.display = 'none';
  } else {
    // Default form
    document.getElementById('form-default').classList.remove('hidden');
    const tempBtn = document.getElementById('btn-temp-save-default');
    const finalBtn = document.getElementById('btn-final-save-default');
    if (isTempOrPerm) tempBtn.style.display = 'block';
    else tempBtn.style.display = 'none';
  }
}

// ---- Data operations ----
async function loadTemp() {
  const body = document.getElementById('data-body');
  body.innerHTML = `<tr><td colspan="4" style="color:var(--text-dim)">Loading...</td></tr>`;
  try {
    const result = await apiCall('tempList', { targetStaffName: profile.name, taskName: currentTask });
    if (!result.ok) {
      body.innerHTML = `<tr><td colspan="4">${result.error || 'Could not load entries'}</td></tr>`;
      return;
    }
    tempEntries = result.items || [];
    renderTable();
  } catch (e) {
    body.innerHTML = `<tr><td colspan="4">Network error</td></tr>`;
  }
}

function filterTable() {
  const q = document.getElementById('search-temp').value.trim().toLowerCase();
  if (!q) { renderTable(); return; }
  const filtered = tempEntries.filter(item =>
    String(item.details || "").toLowerCase().includes(q) ||
    String(item.staffName || "").toLowerCase().includes(q)
  );
  renderTable(filtered);
}

function renderTable(list) {
  const items = list || tempEntries;
  const body = document.getElementById('data-body');
  body.innerHTML = "";
  if (items.length === 0) {
    body.innerHTML = `<tr><td colspan="4" style="color:var(--text-dim)">No matching entries</td></tr>`;
    return;
  }
  items.forEach(item => {
    body.insertAdjacentHTML('beforeend', `<tr>
      <td>${item.staffName}</td>
      <td style="color:var(--text-dim)">${item.createdAt || ''}</td>
      <td>${item.details || ''}</td>
      <td style="text-align:right; white-space:nowrap;">
        <button class="btn icon-btn icon-tick" onclick="finalizeEntry('${item.tempId}')" title="Finalize">✓</button>
        <button class="btn icon-btn icon-cross" onclick="removeEntry('${item.tempId}')" title="Delete">✕</button>
      </td>
    </tr>`);
  });
}

async function saveData(type) {
  const ref = document.getElementById('field-ref').value;
  const cas = document.getElementById('field-case').value;
  const comment = document.getElementById('field-comment').value;
  try {
    if (type === 'Temp') {
      if (!comment) return alert("Comment required");
      const result = await apiCall('tempAdd', {
        targetStaffName: profile.name,
        taskName: currentTask,
        comment, refNo: ref, caseNo: cas
      });
      if (!result.ok) return alert(result.error || "Could not save entry");
    } else {
      if (!ref && !cas) return alert("Reference or Case Required");
      const result = await apiCall('finalAdd', {
        targetStaffName: profile.name,
        taskName: currentTask,
        comment, refNo: ref, caseNo: cas
      });
      if (!result.ok) return alert(result.error || "Could not save entry");
      alert("Confirmed. Data pushed to central records.");
    }
    document.getElementById('field-ref').value = "";
    document.getElementById('field-case').value = "";
    document.getElementById('field-comment').value = "";
    await loadTemp();
  } catch (e) {
    alert("Network error while saving.");
  }
}

async function saveRiderScheduling(type) {
  const ref = document.getElementById('field-ref-rider').value;
  const cas = document.getElementById('field-case-rider').value;
  const date = document.getElementById('field-date-rider').value;
  const hour = document.getElementById('field-hour-rider').value;
  const min = document.getElementById('field-min-rider').value;
  
  if (!ref && !cas) return alert("Reference or Case Required");
  if (!date) return alert("Date required");
  if (!hour || !min) return alert("Time required");
  
  const scheduledTime = `${hour}:${min}`;
  
  try {
    const result = await apiCall('finalAdd', {
      targetStaffName: profile.name,
      taskName: currentTask,
      refNo: ref, caseNo: cas,
      scheduledDate: date,
      scheduledTime: scheduledTime
    });
    if (!result.ok) return alert(result.error || "Could not save entry");
    alert("Rider scheduling saved!");
    document.getElementById('field-ref-rider').value = "";
    document.getElementById('field-case-rider').value = "";
    document.getElementById('field-date-rider').value = "";
    document.getElementById('field-hour-rider').value = "";
    document.getElementById('field-min-rider').value = "";
    await loadTemp();
  } catch (e) {
    alert("Network error while saving.");
  }
}

async function saveVisitRating(type) {
  const ref = document.getElementById('field-ref-rating').value;
  const cas = document.getElementById('field-case-rating').value;
  const rating = document.getElementById('field-rating').value;
  
  if (!ref && !cas) return alert("Reference or Case Required");
  if (!rating) return alert("Rating required");
  
  try {
    const result = await apiCall('finalAdd', {
      targetStaffName: profile.name,
      taskName: currentTask,
      refNo: ref, caseNo: cas,
      rating: rating
    });
    if (!result.ok) return alert(result.error || "Could not save entry");
    alert("Rating saved!");
    document.getElementById('field-ref-rating').value = "";
    document.getElementById('field-case-rating').value = "";
    document.getElementById('field-rating').value = "";
    await loadTemp();
  } catch (e) {
    alert("Network error while saving.");
  }
}

async function saveApproval(type) {
  const ref = document.getElementById('field-ref-approval').value;
  const cas = document.getElementById('field-case-approval').value;
  const status = document.querySelector('input[name="approval-status"]:checked');
  
  if (!ref && !cas) return alert("Reference or Case Required");
  if (!status) return alert("Approval status required");
  
  try {
    const result = await apiCall('finalAdd', {
      targetStaffName: profile.name,
      taskName: currentTask,
      refNo: ref, caseNo: cas,
      approvalStatus: status.value
    });
    if (!result.ok) return alert(result.error || "Could not save entry");
    alert("Approval saved!");
    document.getElementById('field-ref-approval').value = "";
    document.getElementById('field-case-approval').value = "";
    document.querySelector('input[name="approval-status"]').checked = false;
    await loadTemp();
  } catch (e) {
    alert("Network error while saving.");
  }
}

async function saveCopyableTile(type) {
  const ref = document.getElementById('field-ref-tile').value;
  const cas = document.getElementById('field-case-tile').value;
  
  try {
    if (type === 'Temp') {
      if (!ref && !cas) return alert("Reference or Case Required");
      const result = await apiCall('tempAdd', {
        targetStaffName: profile.name,
        taskName: currentTask,
        refNo: ref, caseNo: cas
      });
      if (!result.ok) return alert(result.error || "Could not save entry");
    } else {
      if (!ref && !cas) return alert("Reference or Case Required");
      const result = await apiCall('finalAdd', {
        targetStaffName: profile.name,
        taskName: currentTask,
        refNo: ref, caseNo: cas
      });
      if (!result.ok) return alert(result.error || "Could not save entry");
      alert("Saved!");
    }
    document.getElementById('field-ref-tile').value = "";
    document.getElementById('field-case-tile').value = "";
    await loadTemp();
  } catch (e) {
    alert("Network error while saving.");
  }
}

async function finalizeEntry(tempId) {
  if (!confirm("Push this entry to Final records?")) return;
  const result = await apiCall('tempFinalize', { tempId });
  if (!result.ok) return alert(result.error || "Could not finalize");
  await loadTemp();
}

async function removeEntry(tempId) {
  if (!confirm("Permanently delete this entry?")) return;
  const result = await apiCall('tempDelete', { tempId });
  if (!result.ok) return alert(result.error || "Could not delete");
  await loadTemp();
}

function copyToClipboard(elementId) {
  const text = document.getElementById(elementId).innerText;
  navigator.clipboard.writeText(text).then(() => {
    alert('Copied to clipboard!');
  }).catch(() => {
    alert('Failed to copy');
  });
}

function hideAll() {
  document.querySelectorAll('.glass-panel').forEach(p => p.classList.add('hidden'));
}

function navigateBack() {
  if (!document.getElementById('scr-entry').classList.contains('hidden')) openProfile(profile.name);
  else if (!document.getElementById('scr-tasks').classList.contains('hidden')) showSelection();
}
</script>
