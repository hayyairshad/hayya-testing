<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahana Trackers | Portal</title>
    <style>
        :root {
            --bg-color: #00332e;
            --panel-color: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.15);
            --accent-color: #00796b;
            --text-main: #ffffff;
            --text-dim: #b2dfdb;
        }

        * { box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }

        body {
            background: var(--bg-color);
            background-image: linear-gradient(180deg, #00332e 0%, #001a1a 100%);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* PROFESSIONAL HEADER */
        header {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-left { display: flex; align-items: center; gap: 20px; }
        .logo-group { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.05); padding: 5px 12px; border-radius: 8px; }
        .logo-group img { height: 32px; width: auto; }
        .site-title { font-weight: 500; font-size: 1.1rem; letter-spacing: 0.5px; border-left: 1px solid var(--border-color); padding-left: 20px; }

        .header-right { display: flex; align-items: center; gap: 20px; }
        .user-meta { font-size: 0.85rem; color: var(--text-dim); }

        /* BUTTONS */
        .btn {
            background: var(--panel-color);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }
        .btn-primary { background: var(--accent-color); border: none; font-weight: 600; }
        .btn-primary:hover { background: #00897b; }

        /* CONTAINERS */
        .main-content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .glass-panel {
            background: var(--panel-color);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .wide-panel { max-width: 900px; }
        .hidden { display: none !important; }

        /* TYPOGRAPHY & INPUTS */
        h2 { font-weight: 400; margin-top: 0; margin-bottom: 25px; letter-spacing: -0.5px; }
        label { display: block; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        
        input {
            width: 100%; padding: 12px; margin-bottom: 20px;
            background: rgba(0,0,0,0.2); border: 1px solid var(--border-color);
            border-radius: 6px; color: white; font-size: 1rem;
        }
        input:focus { border-color: var(--accent-color); outline: none; background: rgba(0,0,0,0.4); }

        /* DASHBOARD GRID */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .dashboard-item {
            background: rgba(255,255,255,0.03); padding: 30px 20px; border-radius: 12px;
            text-align: center; border: 1px solid var(--border-color);
            cursor: pointer; transition: 0.2s ease;
        }
        .dashboard-item:hover { background: rgba(255,255,255,0.08); transform: translateY(-3px); border-color: var(--accent-color); }
        .dashboard-item strong { display: block; font-size: 1.1rem; font-weight: 500; }
        .dashboard-item small { color: var(--text-dim); font-size: 0.75rem; }

        /* DATA TABLE */
        .data-section { margin-top: 40px; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .data-table th { text-align: left; padding: 12px; border-bottom: 2px solid var(--border-color); color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; }
        .data-table td { padding: 14px 12px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
        
        @media (max-width: 600px) {
            header { padding: 10px 20px; }
            .site-title { display: none; }
            .dashboard-grid { grid-template-columns: 1fr; }
            .glass-panel { padding: 25px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="logo-group">
                <img src="mahana-logo.png" alt="Mahana">
                <img src="friends-logo.png" alt="Friends">
            </div>
            <span class="site-title">Mahana Trackers</span>
        </div>
        <div class="header-right">
            <button id="nav-back" class="btn hidden" onclick="navigateBack()">Back</button>
            <span id="active-user-display" class="user-meta hidden"></span>
            <button id="btn-logout" class="btn hidden" onclick="location.reload()">Sign Out</button>
        </div>
    </header>

    <div class="main-content">
        <!-- 1. LOGIN -->
        <div id="scr-login" class="glass-panel">
            <h2>Sign In</h2>
            <label>User Identification</label>
            <input type="text" id="in-user" placeholder="Enter your ID">
            <label>Security Password</label>
            <input type="password" id="in-pass" placeholder="••••••••">
            <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Sign In</button>
            <div style="display:flex; justify-content:center; gap:20px; margin-top:25px; font-size:0.8rem;">
                <a href="#" style="color:var(--text-dim); text-decoration:none;">Reset Password</a>
                <span style="color:var(--border-color)">|</span>
                <a href="#" style="color:var(--text-dim); text-decoration:none;">Request Access</a>
            </div>
        </div>

        <!-- 2. STAFF SELECT -->
        <div id="scr-select" class="glass-panel wide-panel hidden">
            <h2>Workspace Management</h2>
            <div id="staff-grid" class="dashboard-grid"></div>
        </div>

        <!-- 3. TASK SELECT -->
        <div id="scr-tasks" class="glass-panel wide-panel hidden">
            <h2 id="workspace-label">Workspace</h2>
            <div id="task-grid" class="dashboard-grid"></div>
        </div>

        <!-- 4. DATA ENTRY -->
        <div id="scr-entry" class="glass-panel wide-panel hidden">
            <h2 id="bold-task-header" style="font-weight: 600;"></h2>
            
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:20px;">
                <div>
                    <label>Reference Number</label>
                    <input type="number" id="field-ref" inputmode="numeric">
                </div>
                <div>
                    <label>Case Number</label>
                    <input type="number" id="field-case" inputmode="numeric">
                </div>
                <div>
                    <label>Mobile Contact</label>
                    <input type="number" id="field-mob" inputmode="numeric">
                </div>
            </div>

            <div style="display:flex; gap:12px; margin-top:10px;">
                <button class="btn btn-primary" onclick="saveData('Temp')">Temp Save</button>
                <button class="btn" onclick="saveData('Final')">Final Save</button>
            </div>

            <div class="data-section">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label>Recent Temporary Entries</label>
                    <button class="btn" style="padding:4px 10px; font-size:0.7rem;" onclick="clearAll()">Clear History</button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Staff Member</th>
                            <th>Timestamp</th>
                            <th>Mobile</th>
                            <th style="text-align:right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="data-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // STAFF CONFIGURATION
        const STAFF = {
            "jawad":   { name: "Jawad",   pass: "123", level: 0, role: "Director", tasks: ["Cross Checking", "Entries"] },
            "uzair":   { name: "Uzair",   pass: "123", level: 1, role: "Manager HP", tasks: ["Presentation"] },
            "ahmed":   { name: "Ahmed",   pass: "123", level: 1, role: "Head of Recovery", tasks: ["Reporting"] },
            "waqas":   { name: "Waqas",   pass: "123", level: 2, role: "Rider", tasks: ["Visit"] },
            "junaid":  { name: "Junaid",  pass: "123", level: 2, role: "Clerk", tasks: ["Delivery Linkage"] },
            "zuni":    { name: "Zuni",    pass: "123", level: 2, role: "Manager Recovery", tasks: ["Entries"] },
            "sumaira": { name: "Sumaira", pass: "123", level: 2, role: "Call Center", tasks: ["Follow-up"] }
        };

        let user = null; 
        let profile = null;
        let db = JSON.parse(localStorage.getItem('mahana_db')) || [];

        function doLogin() {
            const id = document.getElementById('in-user').value.toLowerCase();
            const pw = document.getElementById('in-pass').value;

            if (STAFF[id] && STAFF[id].pass === pw) {
                user = STAFF[id];
                document.getElementById('scr-login').classList.add('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                document.getElementById('active-user-display').classList.remove('hidden');
                document.getElementById('active-user-display').innerText = user.name;

                if (user.level < 2) showSelection();
                else openProfile(user.name);
            } else alert("Authorization Failed");
        }

        function showSelection() {
            hideAll();
            document.getElementById('scr-select').classList.remove('hidden');
            document.getElementById('nav-back').classList.add('hidden');
            const grid = document.getElementById('staff-grid');
            grid.innerHTML = "";
            Object.values(STAFF).forEach(s => {
                if (user.level === 0 || s.level > 0) {
                    grid.insertAdjacentHTML('beforeend', `
                        <div class="dashboard-item" onclick="openProfile('${s.name}')">
                            <strong>${s.name}</strong>
                            <small>${s.role}</small>
                        </div>
                    `);
                }
            });
        }

        function openProfile(name) {
            hideAll();
            profile = Object.values(STAFF).find(s => s.name === name);
            document.getElementById('scr-tasks').classList.remove('hidden');
            document.getElementById('workspace-label').innerText = name + "'s Workspace";
            if (user.level < 2) document.getElementById('nav-back').classList.remove('hidden');
            const grid = document.getElementById('task-grid');
            grid.innerHTML = "";
            profile.tasks.forEach(t => {
                grid.insertAdjacentHTML('beforeend', `<div class="dashboard-item" onclick="openForm('${t}')"><strong>${t}</strong></div>`);
            });
        }

        function openForm(task) {
            hideAll();
            document.getElementById('scr-entry').classList.remove('hidden');
            document.getElementById('bold-task-header').innerText = task;
            document.getElementById('nav-back').classList.remove('hidden');
            updateTable();
        }

        function saveData(type) {
            const ref = document.getElementById('field-ref').value;
            const cas = document.getElementById('field-case').value;
            const mob = document.getElementById('field-mob').value;
            if (type === 'Temp' && !mob) return alert("Contact Number Required");
            if (type === 'Final' && !ref && !cas) return alert("Reference or Case Required");
            if (type === 'Final') return alert("Confirmed. Data pushed to central records.");

            db.unshift({
                staff: profile.name,
                time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12: true}),
                mob: mob,
                id: Date.now()
            });
            localStorage.setItem('mahana_db', JSON.stringify(db));
            updateTable();
            document.getElementById('field-ref').value = "";
            document.getElementById('field-case').value = "";
            document.getElementById('field-mob').value = "";
        }

        function updateTable() {
            const body = document.getElementById('data-body');
            body.innerHTML = "";
            db.forEach(item => {
                if (item.staff === profile.name) {
                    body.insertAdjacentHTML('beforeend', `<tr>
                        <td>${item.staff}</td>
                        <td style="color:var(--text-dim)">${item.time}</td>
                        <td>${item.mob}</td>
                        <td style="text-align:right"><button class="btn" style="padding:2px 8px; color:#ff8a80; border-color:#ff8a80" onclick="removeEntry(${item.id})">Delete</button></td>
                    </tr>`);
                }
            });
        }

        function removeEntry(id) {
            if(confirm("Permanently delete this entry?")) {
                db = db.filter(i => i.id !== id);
                localStorage.setItem('mahana_db', JSON.stringify(db));
                updateTable();
            }
        }

        function clearAll() {
            if(confirm("Wipe all temporary history for this profile?")) {
                db = db.filter(i => i.staff !== profile.name);
                localStorage.setItem('mahana_db', JSON.stringify(db));
                updateTable();
            }
        }

        function hideAll() {
            document.querySelectorAll('.glass-panel').forEach(p => p.classList.add('hidden'));
        }

        function navigateBack() {
            if (!document.getElementById('scr-entry').classList.contains('hidden')) openProfile(profile.name);
            else if (!document.getElementById('scr-tasks').classList.contains('hidden')) showSelection();
        }
    </script>
</body>
</html>
