<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahana Trackers</title>
    <style>
        :root {
            --teal-bg: #004d40;
            --glass-white: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --teal-accent: #00897b;
            --text-glow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body {
            background-color: var(--teal-bg);
            background-image: radial-gradient(circle at center, #006064 0%, #002d2d 100%);
            color: white;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo-box { height: 45px; display: flex; gap: 12px; align-items: center; }
        .logo-box img { height: 100%; width: auto; filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); }
        .site-name { font-weight: bold; font-size: 1.3rem; letter-spacing: 1px; color: #00e5ff; text-shadow: var(--text-glow); }

        .header-right { display: flex; align-items: center; gap: 12px; }
        .user-tag { font-size: 0.9rem; color: #00e5ff; padding-right: 12px; border-right: 1px solid var(--glass-border); }

        /* BUTTONS */
        .btn-glass {
            background: var(--glass-white);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-glass:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }
        .btn-main { background: var(--teal-accent); border: none; width: 100%; margin-top: 15px; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .btn-main:active { transform: scale(0.98); }

        /* CARDS */
        .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .glass-card {
            background: var(--glass-white);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 35px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        .wide-card { max-width: 900px; }
        .hidden { display: none !important; }

        /* INPUTS */
        input {
            width: 100%; padding: 14px; margin: 10px 0;
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            border-radius: 12px; color: white; font-size: 1.1rem;
        }
        input:focus { border-color: #00e5ff; box-shadow: 0 0 10px rgba(0,229,255,0.3); outline: none; }
        label { font-size: 0.85rem; color: #b2dfdb; margin-left: 5px; }

        /* TILES */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 25px; }
        .tile {
            background: var(--glass-white); padding: 30px 15px; border-radius: 20px;
            text-align: center; border: 1px solid var(--glass-border);
            cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .tile:hover { transform: scale(1.05); background: rgba(255,255,255,0.25); border-color: #00e5ff; }
        .tile strong { font-size: 1.1rem; display: block; margin-bottom: 5px; }

        /* TABLE */
        .history-section { margin-top: 40px; }
        .history-table { width: 100%; border-collapse: collapse; margin-top: 15px; border-radius: 15px; overflow: hidden; }
        .history-table th { background: rgba(0,0,0,0.2); text-align: left; padding: 15px; color: #00e5ff; font-size: 0.9rem; }
        .history-table td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); }
        .del-btn { color: #ff5252; background: none; border: 1px solid #ff5252; border-radius: 5px; cursor: pointer; padding: 2px 8px; }

        @media (max-width: 600px) {
            .site-name { display: none; }
            .grid-container { grid-template-columns: 1fr 1fr; gap: 10px; }
            .glass-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="logo-box">
                <img src="mahana-logo.png" alt="Mahana">
                <img src="friends-logo.png" alt="Friends">
            </div>
            <span class="site-name">Mahana Trackers</span>
            <button id="nav-back" class="btn-glass hidden" onclick="navigateBack()" style="margin-left:15px;">← Back</button>
        </div>
        <div class="header-right">
            <span id="active-user-name" class="user-tag hidden"></span>
            <button id="btn-logout" class="btn-glass hidden" onclick="location.reload()">Logout</button>
        </div>
    </header>

    <div class="container">
        <!-- SCREEN 1: LOGIN -->
        <div id="scr-login" class="glass-card">
            <h2 style="text-align:center; color:#00e5ff;">Sign In</h2>
            <input type="text" id="in-user" placeholder="User ID">
            <input type="password" id="in-pass" placeholder="Password">
            <button class="btn-glass btn-main" onclick="doLogin()">Sign In</button>
            <div style="display:flex; justify-content:space-between; margin-top:25px; font-size:0.85rem;">
                <a href="#" style="color:#00e5ff; text-decoration:none;">Forgot Password</a>
                <a href="#" style="color:#00e5ff; text-decoration:none;">Sign Up</a>
            </div>
        </div>

        <!-- SCREEN 2: STAFF SELECTION -->
        <div id="scr-select" class="glass-card wide-card hidden">
            <h2 style="color:#00e5ff;">Load Workspace</h2>
            <div id="staff-tiles" class="grid-container"></div>
        </div>

        <!-- SCREEN 3: TASK SELECTION -->
        <div id="scr-tasks" class="glass-card wide-card hidden">
            <h2 id="workspace-header" style="color:#00e5ff;">Workspace</h2>
            <div id="task-tiles" class="grid-container"></div>
        </div>

        <!-- SCREEN 4: DATA ENTRY -->
        <div id="scr-entry" class="glass-card wide-card hidden">
            <h1 id="bold-task-name" style="color:#00e5ff; margin-top:0;">Task Name</h1>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <div style="grid-column: span 2;">
                    <label>Ref Number</label>
                    <input type="number" id="field-ref" inputmode="numeric" placeholder="0000">
                </div>
                <div>
                    <label>Case Number</label>
                    <input type="number" id="field-case" inputmode="numeric" placeholder="0000">
                </div>
                <div>
                    <label>Mobile Number</label>
                    <input type="number" id="field-mob" inputmode="numeric" placeholder="0300...">
                </div>
            </div>

            <div style="display:flex; gap:15px; margin-top:25px;">
                <button class="btn-glass btn-main" onclick="saveData('Temp')">Temp Save</button>
                <button class="btn-glass btn-main" style="background:#37474f" onclick="saveData('Final')">Final Save</button>
            </div>

            <div class="history-section">
                <h3 style="color:#00e5ff;">Temporary Entries</h3>
                <div style="overflow-x: auto;">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Staff</th>
                                <th>Time</th>
                                <th>Mobile</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="temp-grid-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- SPECIAL INPUT: SETUP STAFF HERE ---
        const STAFF_DATA = {
            "jawad":   { name: "Jawad",   pass: "123", level: 0, role: "Director", tasks: ["Cross Checking", "Entries"] },
            "uzair":   { name: "Uzair",   pass: "123", level: 1, role: "Manager HP", tasks: ["Presentation"] },
            "ahmed":   { name: "Ahmed",   pass: "123", level: 1, role: "Head of Recovery", tasks: ["Reporting"] },
            "waqas":   { name: "Waqas",   pass: "123", level: 2, role: "Rider", tasks: ["Visit"] },
            "junaid":  { name: "Junaid",  pass: "123", level: 2, role: "Clerk", tasks: ["Delivery Linkage"] },
            "zuni":    { name: "Zuni",    pass: "123", level: 2, role: "Manager Recovery", tasks: ["Entries"] },
            "sumaira": { name: "Sumaira", pass: "123", level: 2, role: "Call Center", tasks: ["Follow-up"] }
        };

        let loggedInUser = null; 
        let currentWorkspace = null;
        let storage = JSON.parse(localStorage.getItem('mahana_storage')) || [];

        function doLogin() {
            const u = document.getElementById('in-user').value.toLowerCase();
            const p = document.getElementById('in-pass').value;

            if (STAFF_DATA[u] && STAFF_DATA[u].pass === p) {
                loggedInUser = STAFF_DATA[u];
                document.getElementById('scr-login').classList.add('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                document.getElementById('active-user-name').classList.remove('hidden');
                document.getElementById('active-user-name').innerText = loggedInUser.name;

                if (loggedInUser.level < 2) showStaffSelection();
                else enterWorkspace(loggedInUser.name);
            } else alert("Access Denied");
        }

        function showStaffSelection() {
            hideAll();
            document.getElementById('scr-select').classList.remove('hidden');
            document.getElementById('nav-back').classList.add('hidden');
            const grid = document.getElementById('staff-tiles');
            grid.innerHTML = "";
            Object.values(STAFF_DATA).forEach(s => {
                if (loggedInUser.level === 0 || s.level > 0) {
                    const tile = document.createElement('div');
                    tile.className = "tile";
                    tile.innerHTML = `<strong>${s.name}</strong><small>${s.role}</small>`;
                    tile.onclick = () => enterWorkspace(s.name);
                    grid.appendChild(tile);
                }
            });
        }

        function enterWorkspace(staffName) {
            hideAll();
            currentWorkspace = Object.values(STAFF_DATA).find(s => s.name === staffName);
            document.getElementById('scr-tasks').classList.remove('hidden');
            document.getElementById('workspace-header').innerText = staffName + "'s Workspace";
            if (loggedInUser.level < 2) document.getElementById('nav-back').classList.remove('hidden');
            const grid = document.getElementById('task-tiles');
            grid.innerHTML = "";
            currentWorkspace.tasks.forEach(t => {
                const tile = document.createElement('div');
                tile.className = "tile";
                tile.innerHTML = `<strong>${t}</strong>`;
                tile.onclick = () => showEntryForm(t);
                grid.appendChild(tile);
            });
        }

        function showEntryForm(task) {
            hideAll();
            document.getElementById('scr-entry').classList.remove('hidden');
            document.getElementById('bold-task-name').innerText = task;
            document.getElementById('nav-back').classList.remove('hidden');
            refreshGrid();
        }

        function saveData(mode) {
            const ref = document.getElementById('field-ref').value;
            const cas = document.getElementById('field-case').value;
            const mob = document.getElementById('field-mob').value;
            if (mode === 'Temp' && !mob) return alert("Mobile Number Required");
            if (mode === 'Final' && !ref && !cas) return alert("Ref or Case Number Required");
            if (mode === 'Final') return alert("Final data recorded.");

            storage.unshift({
                staff: currentWorkspace.name,
                time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
                mob: mob,
                id: Date.now()
            });
            localStorage.setItem('mahana_storage', JSON.stringify(storage));
            refreshGrid();
            document.getElementById('field-ref').value = "";
            document.getElementById('field-case').value = "";
            document.getElementById('field-mob').value = "";
        }

        function refreshGrid() {
            const body = document.getElementById('temp-grid-body');
            body.innerHTML = "";
            storage.forEach(item => {
                if (item.staff === currentWorkspace.name) {
                    body.insertAdjacentHTML('beforeend', `<tr>
                        <td>${item.staff}</td>
                        <td>${item.time}</td>
                        <td>${item.mob}</td>
                        <td><button class="del-btn" onclick="removeItem(${item.id})">X</button></td>
                    </tr>`);
                }
            });
        }

        function removeItem(id) {
            if(confirm("Delete entry?")) {
                storage = storage.filter(i => i.id !== id);
                localStorage.setItem('mahana_storage', JSON.stringify(storage));
                refreshGrid();
            }
        }

        function hideAll() {
            document.querySelectorAll('.glass-card').forEach(c => c.classList.add('hidden'));
        }

        function navigateBack() {
            if (!document.getElementById('scr-entry').classList.contains('hidden')) enterWorkspace(currentWorkspace.name);
            else if (!document.getElementById('scr-tasks').classList.contains('hidden')) showStaffSelection();
        }
    </script>
</body>
</html>
