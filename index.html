<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESTING PORTAL</title>
    <style>
        /* 1. BASE STYLES & MOBILE OPTIMIZATION */
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-color: #000000; 
            color: white; 
        }

        h1 { color: #ff0000; text-transform: uppercase; letter-spacing: 5px; margin: 20px 0; font-size: 1.8rem; }

        .card { 
            background: #1a1a1a; 
            padding: 25px; 
            border-radius: 12px; 
            border: 2px solid #ff0000; 
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); 
            width: 100%;       
            max-width: 400px;  
            text-align: center;
        }

        .wide-card { max-width: 600px; }
        .hidden { display: none; }

        /* 2. INPUTS & BUTTONS */
        input, select { 
            width: 100%; 
            padding: 12px; 
            margin-top: 15px; 
            background: #000; 
            color: #ff0000; 
            border: 1px solid #ff0000;
            border-radius: 5px;
            outline: none;
            font-size: 16px;
        }

        .row { display: flex; gap: 10px; width: 100%; flex-wrap: wrap; }
        .row input { flex: 1; min-width: 120px; }

        button { 
            width: 100%; 
            padding: 14px; 
            margin-top: 20px; 
            cursor: pointer; 
            background-color: #ff0000; 
            color: white; 
            border: none; 
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            transition: 0.3s;
        }

        button:hover { background-color: #b30000; box-shadow: 0 0 15px #ff0000; }
        .secondary-btn { background: transparent; border: 1px solid #ff0000; margin-top: 10px; }

        /* 3. TASK LIST & HISTORY */
        ul { padding: 0; list-style: none; text-align: left; }
        li { 
            background: #222; 
            margin-bottom: 10px; 
            padding: 15px; 
            border-left: 5px solid #ff0000; 
            border-radius: 4px;
            cursor: pointer;
        }

        .history-container {
            margin-top: 25px;
            border-top: 1px solid #444;
            padding-top: 15px;
            text-align: left;
        }

        .history-item {
            font-size: 13px;
            background: #111;
            padding: 12px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .del-x { 
            background: #333; color: red; border: 1px solid red; 
            width: 30px; height: 30px; padding: 0; margin: 0; 
        }

        /* 4. MOBILE STACKING */
        @media (max-width: 480px) {
            .row { flex-direction: column; gap: 0; }
            .wide-card { padding: 15px; }
        }
    </style>
</head>
<body>

    <h1>TESTING</h1>

    <!-- STAGE 1: MASTER LOGIN -->
    <div id="master-login" class="card">
        <h2 style="color: #ff0000;">SYSTEM ACCESS</h2>
        <input type="text" id="user-id" placeholder="User ID">
        <input type="password" id="user-pass" placeholder="Password">
        <button onclick="checkMasterLogin()">Authorize</button>
    </div>

    <!-- STAGE 2: SELECT STAFF -->
    <div id="login-page" class="card hidden">
        <h2 style="color: #ff0000;">SELECT STAFF</h2>
        <select id="employee-select">
            <option value="Uzair">Uzair (Manager HP)</option>
            <option value="Waqas">Waqas (Rider)</option>
            <option value="Junaid">Junaid (Clerk)</option>
            <option value="Ahmed">Ahmed (Head of Recovery)</option>
            <option value="Zuni">Zuni (Manager Recovery)</option>
            <option value="Sumaira">Sumaira (Call Center)</option>
            <option value="Jawad">Jawad (Director)</option>
        </select>
        <button onclick="showTasks()">Load Profile</button>
    </div>

    <!-- STAGE 3: TASK PAGE -->
    <div id="task-page" class="card hidden">
        <h2 id="welcome-msg" style="color: #ff0000; margin-bottom: 5px;"></h2>
        <p id="user-role" style="color: #888; font-style: italic; margin-bottom: 20px;"></p>
        <ul id="task-list"></ul>
        <button class="secondary-btn" onclick="logout()">Terminate Session</button>
    </div>

    <!-- STAGE 4: DATA ENTRY & HISTORY -->
    <div id="entry-form-page" class="card wide-card hidden">
        <h2 style="color: #ff0000;">DATA ENTRY</h2>
        <p id="active-task" style="color: #888;"></p>
        
        <input type="text" id="phone-num" placeholder="Phone Number (Required)">
        <div class="row">
            <input type="text" id="case-num" placeholder="Case Number">
            <input type="text" id="ref-no" placeholder="Ref No.">
        </div>

        <div class="row">
            <button onclick="handleSave('Temp')">Temp Save</button>
            <button onclick="handleSave('Final')" style="background-color: #444;">Final Save</button>
        </div>
        <button class="secondary-btn" onclick="backToTasks()">Back to Tasks</button>

        <!-- Search and List -->
        <div class="history-container">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="color: #ff0000; margin: 0;">RECORDS</h3>
                <button onclick="clearAllData()" style="width: auto; padding: 5px 10px; font-size: 10px; background: #444; margin: 0;">Clear All</button>
            </div>
            <input type="text" id="search-bar" placeholder="Filter by Phone, Case, or Ref..." onkeyup="searchData()">
            <div id="history-list" style="max-height: 300px; overflow-y: auto; margin-top: 10px;"></div>
        </div>
    </div>

    <script>
        // --- DATA ---
        const MASTER_ID = "admin";
        const MASTER_PASS = "1234";

        const employeeInfo = {
            "Uzair": { role: "Manager HP", tasks: ["Presentation"] },
            "Waqas": { role: "Rider", tasks: ["Visit"] },
            "Junaid": { role: "Clerk", tasks: ["Delivery Linkage"] },
            "Ahmed": { role: "Head of Recovery", tasks: ["Reporting"] },
            "Zuni": { role: "Manager Recovery", tasks: ["Entries"] },
            "Sumaira": { role: "Call Center", tasks: ["Follow-up"] },
            "Jawad": { role: "Director", tasks: ["Cross checking"] }
        };

        // Initialize Memory
        let tempStorage = JSON.parse(localStorage.getItem('employeeData')) || [];

        // --- NAVIGATION ---
        function checkMasterLogin() {
            const id = document.getElementById('user-id').value;
            const pass = document.getElementById('user-pass').value;
            if (id === MASTER_ID && pass === MASTER_PASS) {
                document.getElementById('master-login').classList.add('hidden');
                document.getElementById('login-page').classList.remove('hidden');
            } else { alert("Access Denied"); }
        }

        function showTasks() {
            const user = document.getElementById('employee-select').value;
            const data = employeeInfo[user];
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('task-page').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = user;
            document.getElementById('user-role').innerText = data.role;

            const list = document.getElementById('task-list');
            list.innerHTML = "";
            data.tasks.forEach(task => {
                let li = document.createElement('li');
                li.innerText = "◈ " + task;
                li.onclick = () => openForm(task);
                list.appendChild(li);
            });
            renderHistory();
        }

        function openForm(taskName) {
            document.getElementById('task-page').classList.add('hidden');
            document.getElementById('entry-form-page').classList.remove('hidden');
            document.getElementById('active-task').innerText = "Task: " + taskName;
        }

        function backToTasks() {
            document.getElementById('entry-form-page').classList.add('hidden');
            document.getElementById('task-page').classList.remove('hidden');
        }

        function logout() { location.reload(); }

        // --- CORE LOGIC ---
        function handleSave(saveType) {
            const name = document.getElementById('welcome-msg').innerText;
            const phone = document.getElementById('phone-num').value.trim();
            const caseNo = document.getElementById('case-num').value.trim();
            const refNo = document.getElementById('ref-no').value.trim();

            if (!phone) { alert("Phone is required!"); return; }
            if (!caseNo && !refNo) { alert("Need Case or Ref No!"); return; }

            if (saveType === 'Final') { alert("Final Save triggered."); return; }

            const entry = {
                user: name,
                timestamp: new Date().toLocaleString(),
                phone: phone,
                case: caseNo || "N/A",
                ref: refNo || "N/A"
            };

            tempStorage.unshift(entry); 
            localStorage.setItem('employeeData', JSON.stringify(tempStorage));
            document.getElementById('phone-num').value = "";
            document.getElementById('case-num').value = "";
            document.getElementById('ref-no').value = "";
            renderHistory();
        }

        function renderHistory(filter = "") {
            const listDiv = document.getElementById('history-list');
            listDiv.innerHTML = "";
            tempStorage.forEach((item, index) => {
                const text = (item.phone + item.case + item.ref).toLowerCase();
                if (text.includes(filter.toLowerCase())) {
                    const div = document.createElement('div');
                    div.className = "history-item";
                    div.innerHTML = `
                        <div>
                            <span style="color:red;font-weight:bold;">[TEMP]</span> By ${item.user} at ${item.timestamp}<br>
                            Ph: ${item.phone} | Case: ${item.case} | Ref: ${item.ref}
                        </div>
                        <button class="del-x" onclick="deleteEntry(${index})">X</button>
                    `;
                    listDiv.appendChild(div);
                }
            });
        }

        function deleteEntry(index) {
            if(confirm("Delete this?")) {
                tempStorage.splice(index, 1);
                localStorage.setItem('employeeData', JSON.stringify(tempStorage));
                renderHistory();
            }
        }

        function clearAllData() {
            if(confirm("WIPE ALL DATA?")) {
                tempStorage = [];
                localStorage.removeItem('employeeData');
                renderHistory();
            }
        }

        function searchData() {
            renderHistory(document.getElementById('search-bar').value);
        }
    </script>
</body>
</html>
